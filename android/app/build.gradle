apply plugin: 'com.android.application'

// Release signing. The key is never stored in the repo. Give it to the build
// either in android/keystore.properties (git-ignored) or as environment
// variables on a build server. See docs/signing.md.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String key, String envName ->
    def value = keystoreProperties.getProperty(key) ?: System.getenv(envName)
    return value ? value.trim() : null
}
def releaseStoreFile = signingValue("storeFile", "TET_KEYSTORE_FILE")
def releaseSigningReady = releaseStoreFile != null && rootProject.file(releaseStoreFile).exists()

android {
    namespace = "com.techevolutiontycoon.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Play Console id. The Java namespace above stays com.techevolutiontycoon.game.
        applicationId "tech.evolution.tycoon"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 18
        versionName "0.0.18"
        // Keep a 64-bit ABI beside every 32-bit one if a dependency adds native code.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Two builds of the same app:
    //  - play:     the Google Play bundle. No install-packages permission and
    //              no self-update; Play delivers updates (Play policy).
    //  - sideload: the APK on GitHub releases, with the in-app updater.
    flavorDimensions = ["store"]
    productFlavors {
        play {
            dimension "store"
            buildConfigField "boolean", "SIDELOAD_UPDATER", "false"
        }
        sideload {
            dimension "store"
            buildConfigField "boolean", "SIDELOAD_UPDATER", "true"
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue("storePassword", "TET_KEYSTORE_PASSWORD")
                keyAlias signingValue("keyAlias", "TET_KEY_ALIAS")
                keyPassword signingValue("keyPassword", "TET_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Google Play Games Services v2: sign-in and the cloud save slot.
    implementation "com.google.android.gms:play-services-games-v2:$playGamesVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// A configured keystore still signs the release the same way. With no keystore
// and no TET_* variables, assembleRelease writes an unsigned APK instead.

